    <script>
      // Toggle a class on nav when the collapse opens/closes so we can adapt layout in CSS
      (function(){
        var nav = document.querySelector('.navbar-custom');
        var coll = document.getElementById('navbarNav');
        if (nav && coll && window.jQuery) {
          jQuery(coll).on('show.bs.collapse', function(){ nav.classList.add('is-open'); });
          jQuery(coll).on('hide.bs.collapse', function(){ nav.classList.remove('is-open'); });
        }
      })();
    </script>

  <!-- Global reusable image modal injected across pages -->
  <div class="modal fade" id="global-image-modal" tabindex="-1" role="dialog" aria-labelledby="global-image-modal" aria-hidden="true">
    <div class="modal-dialog" role="document">
      <div class="modal-content">
        <div class="modal-header">
          <button type="button" class="close" data-dismiss="modal" aria-label="Close">
            <span aria-hidden="true">&times;</span>
          </button>
        </div>
        <div class="modal-body" style="text-align:center">
          <img id="global-image-modal-img" src="" alt="" class="modal-image img-fluid" />
        </div>
      </div>
    </div>
  </div>

  <script>
    // Normalize per-page image modals to a single shared modal
    (function () {
      function retargetImageModals() {
        var imgs = document.querySelectorAll('img[data-toggle="modal"]');
        imgs.forEach(function (img) {
          // ensure all target the global modal
          img.setAttribute('data-target', '#global-image-modal');
          img.classList.add('js-global-modal');
        });
      }

      function bindClicks() {
        // Use event delegation in case content is injected later
        document.addEventListener('click', function (e) {
          var t = e.target;
          if (t && t.matches && t.matches('img.js-global-modal')) {
            var full = t.getAttribute('data-full') || t.getAttribute('data-fullsrc') || t.getAttribute('data-src') || t.src;
            var alt = t.getAttribute('alt') || '';
            var modalImg = document.getElementById('global-image-modal-img');
            if (modalImg) {
              modalImg.src = full;
              modalImg.alt = alt;
            }
            // If Bootstrap's JS is present, trigger the modal explicitly to avoid race with data-api
            if (window.jQuery && jQuery.fn && jQuery.fn.modal) {
              jQuery('#global-image-modal').modal('show');
              e.preventDefault();
              e.stopPropagation();
            }
          }
        }, true);
      }

      // Run once header is injected
      try {
        retargetImageModals();
        bindClicks();
        // also observe DOM changes (for pages that load content dynamically)
        var obs = new MutationObserver(function () { retargetImageModals(); });
        obs.observe(document.documentElement || document.body, { childList: true, subtree: true });
      } catch (e) { /* no-op */ }
    })();
  </script>
