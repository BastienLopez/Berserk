<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <script>
      function loadFile(filename, elementId) {
        fetch(filename)
          .then((response) => response.text())
          .then((text) => {
            try {
              if (elementId === "head-content") {
                document.head.insertAdjacentHTML("beforeend", text);
              } else {
                const el = document.getElementById(elementId);
                if (el) el.innerHTML = text;
                else console.warn("loadFile: element not found", elementId);
              }
            } catch (e) {
              console.error("loadFile error", e);
            }
          })
          .catch((err) => console.error("fetch failed", err));
      }

      document.addEventListener("DOMContentLoaded", function () {
        loadFile("/Berserk/templates/head/head-map.html", "head-content");
        loadFile("/Berserk/templates/header.html", "header-content");
        loadFile("/Berserk/templates/footer.html", "footer-content");
      });
    </script>
  </head>

  <body id="body-map">
    <div id="head-content"></div>
    <header id="header-content"></header>

    <main id="main-map">
      <div class="container">
        <div>
          <h1 id="title">Map interactive</h1>
        </div>

        <div id="map-container">
          <div id="map"></div>
        </div>
      </div>
    </main>
    <div id="footer-content"></div>
  </body>
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script src="../js/map.js"></script>
  <script src="/Berserk/js/favicon.js"></script>
  <script src="/Berserk/js/image-modal.js"></script>
</html>
